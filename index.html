<html lang="es"><head><meta charset="utf-8">

<title>LAZO Cam · Grabador con fondos virtuales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.logo{font-weight:700;font-size:20px;letter-spacing:.02em}.logo b{color:var(--ac)}.logo small{font-weight:400;color:var(--mu);margin-left:8px;font-size:13px}
.ib{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:7px 11px}
.app{max-width:1100px;margin:auto;padding:0 16px 24px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.app{grid-template-columns:minmax(0,1fr) 390px;align-items:start}}
.stagewrap{display:flex;flex-direction:column;align-items:center;gap:12px}
#stage{position:relative;--ar:.5625;width:min(100%,calc(66vh * var(--ar)));aspect-ratio:var(--ar);background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--ln)}
canvas{width:100%;height:100%;display:block}
#say{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-size:15px;background:#0006;pointer-events:none}
#say.big{font-size:96px;font-weight:700}
#say:empty{display:none}
#start{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#07090fe6;color:#fff;text-align:center;padding:24px}
#badge{position:absolute;top:10px;left:10px;background:#000a;color:#fff;border-radius:99px;padding:3px 12px;font-size:13px;display:none;gap:6px;align-items:center}
.isrec #badge{display:flex}#badge i{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){#badge i{animation:none}}
#gd{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(#fff4,#fff4) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff4,#fff4) 66.6% 0/1px 100% no-repeat,linear-gradient(#fff4,#fff4) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff4,#fff4) 0 66.6%/100% 1px no-repeat}
#tp{position:absolute;left:0;right:0;top:0;height:46%;overflow:hidden;background:#000b;color:#fff;display:none;font-size:22px;line-height:1.5;text-align:center}
#tp div{padding:30% 18px 100%;white-space:pre-wrap}
.seg{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 10px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff}
.dock{display:flex;align-items:center;gap:22px}
#rb{width:74px;height:74px;border-radius:50%;border:4px solid var(--tx);background:none;padding:5px}
#rb i{display:block;width:100%;height:100%;border-radius:50%;background:var(--rec);transition:border-radius .15s}
.isrec #rb i{border-radius:10px;transform:scale(.55)}
.rd{width:48px;height:48px;border-radius:50%;background:var(--sf);border:1px solid var(--ln)}
.rd.off{background:var(--rec);color:#fff}
#lvl{height:4px;width:110px;background:var(--ln);border-radius:4px;overflow:hidden}#lvl i{display:block;height:100%;width:0;background:var(--ac)}
.lock .seg,.lock .lk{pointer-events:none;opacity:.5}

.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}

.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}

.take div{display:flex;gap:6px;flex-wrap:wrap}.take .btn{padding:6px 10px;font-size:13px}
h2{font-size:14px;margin:14px 0 0}
#vid{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style></head>

<header><div class="logo">LAZO<b> Cam</b><small>Fondos virtuales</small></div><button class="ib" id="theme" aria-label="Cambiar tema">Tema</button></header>

 <div class="seg lk" id="asp" style="width:min(100%,360px)"><button data-a="9:16">9:16</button><button data-a="16:9">16:9</button><button data-a="1:1">1:1</button></div>

</section>
<section class="panel">
 <div class="tabs" role="tablist"><button class="on" data-t="t1">Fondo</button><button data-t="t2">Rótulo</button><button data-t="t3">Cámara</button><button data-t="t4">Guion</button></div>
 <div class="tab on" id="t1">
  <div class="seg" id="mode"><button data-m="ai">Detección inteligente</button><button data-m="key">Pared lisa</button></div>
  <div id="bgs"></div>
  <label>Suavizado de bordes<input type="range" id="edge" min="0" max="8" step="1"></label>
  <label id="tolw">Tolerancia de color (toca el video para elegir el color a quitar)<input type="range" id="tol" min="20" max="200"></label>
  <input type="file" id="fimg" accept="image/*" hidden><input type="color" id="col" hidden>
 </div>
 <div class="tab" id="t2">
  <label class="row">Mostrar rótulo con tu nombre<input type="checkbox" id="lt"></label>
  <label>Nombre<input type="text" id="nm" maxlength="40" placeholder="Luis Lazo"></label>
  <label>Cargo o curso<input type="text" id="rl" maxlength="50" placeholder="Marketing · Gerencia de Ventas"></label>
  <label>Logo o marca de agua (PNG)<input type="file" id="flg" accept="image/*"></label>
  <label class="row">Mostrar logo<input type="checkbox" id="lgo"></label>
 </div>
 <div class="tab" id="t3">
  <div class="lk"><label>Calidad de grabación<select id="q"><option value="720">HD 720p</option><option value="1080">Full HD 1080p (más pesado)</option></select></label></div>
  <label>Cuenta regresiva<select id="cd"><option value="0">Sin cuenta</option><option value="3">3 segundos</option><option value="5">5 segundos</option><option value="10">10 segundos</option></select></label>

  <label class="row">Espejo<input type="checkbox" id="mr"></label>
  <label class="row">Guías de encuadre (no se graban)<input type="checkbox" id="gdc"></label>
  <div id="fx"><label>Brillo<input type="range" id="br" min="70" max="140"></label><label>Contraste<input type="range" id="ct" min="70" max="140"></label></div>
  <button class="btn g" id="flip">Cambiar cámara frontal / trasera</button>
 </div>
 <div class="tab" id="t4">
  <label>Guion (se ve solo en pantalla, no se graba)<textarea id="tpin" rows="6" placeholder="Pega aquí tu guion…"></textarea></label>
  <label class="row">Mostrar teleprompter<input type="checkbox" id="tpon"></label>
  <label>Velocidad<input type="range" id="tps" min="1" max="10" value="3"></label>
  <label>Tamaño de letra<input type="range" id="tpz" min="16" max="40" value="22"></label>
  <div style="display:flex;gap:8px"><button class="btn" id="tpp">Iniciar desplazamiento</button><button class="btn g" id="tpr">Reiniciar</button></div>
 </div>
 <h2>Tus grabaciones</h2><div class="takes" id="takes"><span style="color:var(--mu)">Aquí aparecerán tus videos. Descárgalos o compártelos al terminar.</span></div>
</section></div>
<video id="vid" playsinline muted></video>
<script>

function buildBgs(){const items=[{id:'none',n:'Sin fondo'},{id:'blur',n:'Desenfoque'},{id:'color',n:'Color'},{id:'img',n:'Mi imagen'},...PR];
$('#bgs').innerHTML=items.map(i=>`<button data-id="${i.id}" ${i.id.startsWith('p')&&i.id!=='none'?`style="background-image:url(${gen(i,120,120).toDataURL()})"`:''}>${i.n}</button>`).join('');markBg()}
const markBg=()=>$$('#bgs button').forEach(b=>b.classList.toggle('on',b.dataset.id===S.bg));

const pick=()=>['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60|0).padStart(2,'0');
async function toggleRec(){if(!stream){await startCam();if(!stream)return}
if(rec&&rec.state!=='inactive'){rec.stop();return}
for(let i=S.cd;i>0;i--){say(i,true);await sleep(1000)}say('');
if(!window.MediaRecorder){say('Tu navegador no permite grabar. Prueba con Chrome o Safari actualizado.');return}
const out=cv.captureStream(30);stream.getAudioTracks().forEach(t=>out.addTrack(t));const mt=pick();
rec=new MediaRecorder(out,{...(mt?{mimeType:mt}:{}),videoBitsPerSecond:S.q>720?10e6:6e6});chunks=[];
rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
rec.onstop=()=>{document.body.classList.remove('isrec');$('#app').classList.remove('lock');addTake(new Blob(chunks,{type:(rec.mimeType||mt||'video/webm').split(';')[0]}));$('#pz').classList.remove('off')};
rec.start(1000);el=0;last=performance.now();$('#app').classList.add('lock');document.body.classList.add('isrec')}
setInterval(()=>{const n=performance.now();if(rec&&rec.state==='recording')el+=(n-last)/1000;last=n;$('#tm').textContent=fmt(el)},250);
function addTake(b){const u=URL.createObjectURL(b),ext=b.type.includes('mp4')?'mp4':'webm',nm=`lazo-cam-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.${ext}`,d=document.createElement('div');d.className='take';
d.innerHTML=`<video src="${u}" controls playsinline></video><div><a class="btn" href="${u}" download="${nm}" style="text-decoration:none">Descargar ${ext.toUpperCase()}</a><button class="btn g sh">Compartir</button><button class="btn g dl">Eliminar</button></div><small style="color:var(--mu)">${S.aspect} · ${fmt(el)} · ${(b.size/1048576).toFixed(1)} MB</small>`;
const f=new File([b],nm,{type:b.type});d.querySelector('.sh').onclick=()=>navigator.canShare&&navigator.canShare({files:[f]})?navigator.share({files:[f]}).catch(()=>{}):say('Este navegador no permite compartir archivos. Usa Descargar.');
d.querySelector('.dl').onclick=()=>{d.remove();URL.revokeObjectURL(u)};const t=$('#takes');if(!t.querySelector('.take'))t.innerHTML='';t.prepend(d)}
/* Interfaz */
const loadImg=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)});
const setBg=id=>{S.bg=id;save();markBg()};
function setMode(){$$('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));$('#tolw').style.display=S.mode==='key'?'flex':'none';mask=null;keyC=null;save()}
function init(){applyAspect();buildBgs();setMode();
$('#edge').value=S.edge;$('#tol').value=S.tol;$('#nm').value=S.name;$('#rl').value=S.role;$('#lt').checked=S.lt;$('#lgo').checked=S.lg;$('#q').value=S.q;$('#cd').value=S.cd;$('#zm').value=S.zoom;$('#mr').checked=S.mirror;$('#gdc').checked=S.gd;$('#br').value=S.bright;$('#ct').value=S.contr;$('#gd').style.display=S.gd?'block':'none';$('#mic').classList.toggle('off',!S.mic);
if(!FILT){$('#fx').style.display='none'}
$('#asp').onclick=e=>{const a=e.target.dataset.a;if(!a)return;S.aspect=a;save();applyAspect();if(a==='16:9'&&innerHeight>innerWidth){say('Gira el celular en horizontal para grabar 16:9 con mejor calidad.');setTimeout(()=>say(''),3500)}};
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button,.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.t).classList.add('on')});
$('#mode').onclick=e=>{const m=e.target.dataset.m;if(!m)return;if(m==='ai'&&segFail){say('La detección inteligente no está disponible ahora.');setTimeout(()=>say(''),3000);return}S.mode=m;setMode()};
$('#bgs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;if(id==='img'){if(bgImg)setBg('img');$('#fimg').click();return}if(id==='color')$('#col').click();setBg(id)};
$('#fimg').onchange=async e=>{if(e.target.files[0]){bgImg=await loadImg(e.target.files[0]);setBg('img')}};
$('#col').oninput=e=>{S.color=e.target.value;setBg('color')};
$('#flg').onchange=async e=>{if(e.target.files[0]){logo=await loadImg(e.target.files[0]);S.lg=true;$('#lgo').checked=true;save()}};
const bind=(id,k,fn)=>$(id).addEventListener('input',e=>{const t=e.target;S[k]=t.type==='checkbox'?t.checked:t.type==='text'?t.value:t.tagName==='SELECT'?+t.value:+t.value;save();fn&&fn()});
bind('#edge','edge');bind('#tol','tol');bind('#nm','name');bind('#rl','role');bind('#lt','lt');bind('#lgo','lg');bind('#q','q',applyAspect);bind('#cd','cd');bind('#zm','zoom');bind('#mr','mirror');bind('#br','bright');bind('#ct','contr');bind('#gdc','gd',()=>$('#gd').style.display=S.gd?'block':'none');
$('#flip').onclick=async()=>{S.facing=S.facing==='user'?'environment':'user';S.mirror=S.facing==='user';$('#mr').checked=S.mirror;await startCam()};
$('#stage').onclick=e=>{if(S.mode!=='key'||S.bg==='none'||!v.videoWidth||e.target.closest('#start'))return;const r=e.currentTarget.getBoundingClientRect();let fx=(e.clientX-r.left)/r.width;const fy=(e.clientY-r.top)/r.height;if(S.mirror)fx=1-fx;const[cx,cy,cw,ch]=crop(v.videoWidth,v.videoHeight,cv.width,cv.height,S.zoom),X=Math.min(rc.width-1,Math.max(0,Math.round((cx+fx*cw)/v.videoWidth*rc.width))),Y=Math.min(rc.height-1,Math.max(0,Math.round((cy+fy*ch)/v.videoHeight*rc.height))),d=rx.getImageData(X,Y,1,1).data;keyC=[d[0],d[1],d[2]]};
$('#go').onclick=startCam;$('#rb').onclick=toggleRec;
$('#mic').onclick=()=>{S.mic=!S.mic;stream&&stream.getAudioTracks().forEach(t=>t.enabled=S.mic);$('#mic').classList.toggle('off',!S.mic);save()};
$('#pz').onclick=()=>{if(!rec||rec.state==='inactive')return;if(rec.state==='recording'){rec.pause();$('#pz').classList.add('off')}else{rec.resume();$('#pz').classList.remove('off')}};
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
/* Teleprompter */
const tp=$('#tp');$('#tpin').oninput=e=>$('#tpt').textContent=e.target.value;$('#tpon').onchange=e=>tp.style.display=e.target.checked?'block':'none';$('#tpz').oninput=e=>tp.style.fontSize=e.target.value+'px';
$('#tpp').onclick=e=>{tpPlay=!tpPlay;e.target.textContent=tpPlay?'Pausar desplazamiento':'Iniciar desplazamiento'};$('#tpr').onclick=()=>{tpY=0;tp.scrollTop=0};
(function t(){if(tpPlay){tpY+=+$('#tps').value*.25;tp.scrollTop=tpY}requestAnimationFrame(t)})();
loadSeg();render();segLoop()}
init();
</script></body></html>
